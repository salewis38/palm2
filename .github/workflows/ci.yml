name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    # Runner images are pinned: the `ubuntu-latest` label is moving from 24.04 to 26.04 (rolling out 19 Oct - 19 Nov 2026),
    # which would change the OS under us. 24.04 is the blocking baseline; the 26.04 job below is informational (it never
    # fails the run) until it has been green for a while, then add 26.04 to the `os` list and drop the include.
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: ubuntu-26.04
            python-version: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - name: Refuse a committed settings file (it holds API keys)
        run: |
          if git ls-files --error-unmatch palm_settings.py >/dev/null 2>&1; then
            echo "::error::palm_settings.py is tracked by git. Remove it (git rm --cached) and rotate any keys it contained."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Byte-compile
        run: python -m compileall -q palm.py tests tools

      - name: Lint (non-blocking until the first clean run)
        continue-on-error: true
        run: ruff check .

      - name: Unit tests with coverage
        run: |
          python -W error::RuntimeWarning -m coverage run --source=. --omit="tests/*,palm_settings*.py" \
            -m unittest discover -s tests -v
          python -m coverage report -m

      # Reports and artifacts are produced on the 24.04 baseline only, so artifact names never collide between jobs.
      - name: SD-card wear table (informational; thresholds are enforced by the tests)
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: python tools/measure_wear.py

      - name: Annotated coverage report (stdlib tool, Python 3.12+)
        if: matrix.os == 'ubuntu-24.04' && (matrix.python-version == '3.12' || matrix.python-version == '3.13')
        run: python tools/stdlib_coverage.py --out coverage-report-${{ matrix.python-version }}

      - name: Upload annotated coverage report
        if: matrix.os == 'ubuntu-24.04' && (matrix.python-version == '3.12' || matrix.python-version == '3.13')
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage-report-${{ matrix.python-version }}

      - name: Coverage XML
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: python -m coverage xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
